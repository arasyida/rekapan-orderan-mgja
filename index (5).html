<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#101828; --ink2:#475467; --ink3:#98a2b3;
  --line:#e4e7ec; --line2:#f2f4f7;
  --accent:#9a7224; --accent-soft:#f7f0e1; --gold:#c9a043;
  --danger:#b42318; --danger-soft:#fef3f2; --green:#067647; --green-soft:#ecfdf3;
  --amber:#b54708; --amber-soft:#fffaeb; --blue:#175cd3; --blue-soft:#eff8ff;
  --r:8px; --side:232px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.small{font-size:12.5px}.muted{color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}

/* ---- shell ---- */
nav.tabs{position:fixed;z-index:30;background:var(--card)}
.side-brand{display:none}
.shell{min-height:100vh}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand>div{min-width:0}
.brand h1{font-size:15px;font-weight:700;line-height:1.2}
.brand p{font-size:11.5px;color:var(--ink3)}
.brand h1,.brand p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;border-radius:50%;background:#000;flex:none;object-fit:cover}
.ptitle{display:none;font-size:18px;font-weight:650}
.month{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--card);flex:none}
.month button{width:30px;height:32px;font-size:16px;color:var(--ink2)}
.month button:hover{background:var(--line2)}
.month button[disabled]{opacity:.3;pointer-events:none}
.month span{font-weight:600;font-size:13px;min-width:112px;text-align:center}
.wrap{max-width:1240px;margin:0 auto;padding:14px 14px 100px}

/* mobile bottom nav */
nav.tabs{left:0;right:0;bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:grid;grid-template-columns:repeat(var(--n,5),1fr)}
nav.tabs button{padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink3)}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{color:var(--accent)}

/* desktop: sidebar */
@media (min-width:900px){
  nav.tabs{top:0;bottom:0;left:0;right:auto;width:var(--side);border-top:0;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
  .side-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px}
  .side-brand img{width:40px;height:40px;border-radius:50%;background:#000}
  .side-brand b{display:block;font-size:14px;font-weight:700}
  .side-brand span{display:block;font-size:11.5px;color:var(--ink3);line-height:1.3}
  nav.tabs .in{display:flex;flex-direction:column;gap:2px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:10px;padding:9px 10px;border-radius:7px;font-size:13.5px;color:var(--ink2)}
  nav.tabs button:hover{background:var(--line2)}
  nav.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  nav.tabs button svg{width:18px;height:18px}
  .side-foot{margin-top:auto;padding:0 10px;font-size:11.5px;color:var(--ink3);line-height:1.5}
  .shell{margin-left:var(--side)}
  nav.tabs[style*="none"]+.shell{margin-left:0}
  .brand.mob{display:none}
  .ptitle{display:block}
  .hd{padding:14px 32px}
  .wrap{padding:22px 32px 60px}
}
.side-foot{display:none}
@media (min-width:900px){.side-foot{display:block}}

/* ---- blocks ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
h2.sec{font-size:13px;font-weight:600;color:var(--ink);margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h2.sec .muted{font-weight:400}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.toolbar select{width:auto;min-width:200px;max-width:100%}
.caption{font-size:12.5px;color:var(--ink2);line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--r);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(.94)}
.btn.sec{background:var(--card);border:1px solid var(--line)}
.btn.sec:hover{background:var(--line2)}
.btn.ghost{color:var(--ink2)}
.btn.ghost:hover{background:var(--line2)}
.btn.danger{color:var(--danger);border:1px solid #f4c7c3;background:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
select,input[type=text],input[type=password],input[type=number],input[type=date],textarea{height:38px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:0 11px;width:100%;outline:none;font-size:13.5px}
textarea{height:auto;padding:9px 11px}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr);gap:14px}.kpis.six{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1200px){.kpis.six{grid-template-columns:repeat(6,1fr)}}
.kpi{padding:13px 15px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:19px;font-weight:650;margin-top:4px;letter-spacing:-.01em}
.kpi .s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.kpi .v.pos{color:var(--green)}
.grid2{display:grid;gap:0 18px}
@media (min-width:1000px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;gap:12px}
@media (min-width:1000px){.grid3{grid-template-columns:repeat(3,1fr)}}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:middle}
.tbl th{font-size:11.5px;color:var(--ink3);font-weight:600;background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tfoot td{font-weight:650;border-top:1px solid var(--line);border-bottom:0;background:#fafbfc}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fafbfc}
.tbl .ell{max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.tbl input{height:32px;font-size:13px;padding:0 8px}
.tbl input.n{text-align:right;width:110px}
.tblwrap{overflow-x:auto}

/* lists (mobile) */
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .nm small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .rt{text-align:right;flex:none}
.li .rt b{display:block;font-size:13.5px;font-weight:600}
.day-h{font-size:12px;font-weight:600;color:var(--ink2);margin:16px 2px 6px;display:flex;justify-content:space-between}
.dot{width:8px;height:8px;border-radius:9px;flex:none;display:inline-block}

.empty{text-align:center;padding:36px 20px;color:var(--ink3);font-size:13px}
.empty b{display:block;color:var(--ink2);font-size:14px;font-weight:600;margin-bottom:3px}
.warn{background:var(--amber-soft);color:var(--amber);border:1px solid #fedf89;border-radius:var(--r);padding:10px 12px;font-size:12.5px;margin-top:14px;line-height:1.5}
.warn button{text-decoration:underline;font-weight:600;color:inherit}

.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.no{background:var(--amber-soft);color:var(--amber)}
.badge.nil{background:var(--line2);color:var(--ink2)}
.badge.free{background:var(--blue-soft);color:var(--blue)}
.badge.late{background:var(--danger-soft);color:var(--danger)}

/* chart */
.bars{display:flex;align-items:flex-end;gap:3px;height:150px}
.bars div{flex:1;background:var(--gold);border-radius:2px 2px 0 0;min-height:2px}
.bars div.z{background:var(--line2)}
.bars div.today{background:var(--accent)}
.bar-x{display:flex;gap:3px;margin-top:6px}
.bar-x span{flex:1;font-size:10px;color:var(--ink3);text-align:center}

/* payment segments */
.seg{padding:16px}
.seg .t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.seg .amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.seg .amts .l{font-size:11.5px;color:var(--ink3)}
.seg .amts .v{font-size:14px;font-weight:650;margin-top:2px}
.prog{height:5px;background:var(--line2);border-radius:9px;margin-top:12px;overflow:hidden}
.prog div{height:100%;background:var(--green);border-radius:9px}
.due-line{font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.5}
.due-line b.red{color:var(--danger);font-weight:600}
.fchips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.fchips button{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:500;color:var(--ink2)}
.fchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.x{width:28px;height:28px;border-radius:6px;color:var(--ink3);font-size:17px;flex:none}
.x:hover{background:var(--line2);color:var(--danger)}

/* settings */
.pcard{padding:12px 14px;margin-bottom:8px}
.pcard .names{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.pcard .prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
label.lb{font-size:11.5px;font-weight:500;color:var(--ink2);display:block;margin-bottom:4px}
.mg{font-size:12px;color:var(--ink3);margin-top:8px}
.mg b,.tbl b.pos{color:var(--green);font-weight:600}
.mg b.neg,.tbl b.neg{color:var(--danger)}
.tgrid{display:grid;gap:8px}
@media (min-width:700px){.tgrid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.tgrid{grid-template-columns:repeat(3,1fr)}}
.tgrid .ti{display:flex;align-items:center;gap:6px}
.tgrid .ti span{width:20px;font-size:12px;color:var(--ink3);text-align:right}
.tempo3{display:grid;gap:10px}
@media (min-width:700px){.tempo3{grid-template-columns:repeat(3,1fr)}}
.unit{position:relative}.unit input{padding-right:78px}
.unit em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--ink3)}
details.adv{margin-top:12px}
details.adv summary{cursor:pointer;font-size:12.5px;color:var(--ink2);list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"›";display:inline-block;margin-right:6px;transition:transform .15s}
details.adv[open] summary::before{transform:rotate(90deg)}
.savebar{position:fixed;left:0;right:0;bottom:62px;z-index:25;padding:10px 14px;pointer-events:none}
.savebar .in{max-width:640px;margin:0 auto;background:var(--ink);color:#fff;border-radius:10px;padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:auto;box-shadow:0 8px 24px rgba(16,24,40,.18)}
.savebar .btn.ghost{color:#d0d5dd}
@media (min-width:900px){.savebar{left:var(--side);bottom:20px}}

/* sheet / dialog */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:12px;max-height:88vh}}
@media (min-width:900px){.sheet.wide{max-width:860px}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.sh-h h3{font-size:16px;font-weight:650}
.sh-b{overflow:auto;padding:16px 18px;flex:1}
.sh-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.grp{margin-top:14px}
.grp-h{font-size:11.5px;font-weight:600;color:var(--ink3);margin:0 2px 6px}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line2)}
.qrow:last-child{border-bottom:0}
.qrow.on{background:var(--accent-soft)}
.qrow .nm{flex:1;min-width:0}
.qrow .nm b{font-size:13.5px;font-weight:600;display:block}
.qrow .nm small{font-size:11.5px;color:var(--ink3)}
@media (min-width:900px){
  .grp .card.qgrid{display:grid;grid-template-columns:1fr 1fr}
  .grp .card.qgrid .qrow{border-bottom:1px solid var(--line2)}
  .grp .card.qgrid .qrow:nth-child(odd){border-right:1px solid var(--line2)}
}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;flex:none}
.step button{width:34px;height:34px;font-size:17px;color:var(--ink2)}
.step button:hover{background:var(--line2)}
.step input{width:46px;height:34px;border:0;border-radius:0;text-align:center;padding:0;font-weight:650;font-size:14px;-moz-appearance:textfield;box-shadow:none!important}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ftot{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ftot b{font-size:16px}
.segpick{display:grid;gap:8px;margin-bottom:14px}
@media (min-width:600px){.segpick{grid-template-columns:repeat(3,1fr)}}
.segpick button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:13px;font-weight:600}
.segpick button small{display:block;font-weight:400;color:var(--ink3);font-size:11.5px;margin-top:2px}
.segpick button.on{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;z-index:80;box-shadow:0 6px 20px rgba(16,24,40,.25);max-width:90vw}
@media (min-width:900px){.toast{bottom:28px;left:calc(50% + var(--side)/2)}}
.toast.err{background:var(--danger)}
.dlg{background:var(--card);border-radius:12px;padding:20px;max-width:380px;width:calc(100% - 40px);margin:auto}
.dlg p{font-size:14px;line-height:1.5;margin-bottom:16px}
.center-scrim{align-items:center}
.state{text-align:center;padding:70px 24px;color:var(--ink2);line-height:1.55}
.state b{display:block;font-size:15px;margin-bottom:6px;color:var(--ink)}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.btnrow{display:grid;gap:8px}
@media (min-width:900px){.btnrow{display:flex;flex-wrap:wrap}}

/* invoice */
.inv-wrap{overflow-x:auto}
.inv2{background:#fff;color:#000;width:794px;min-height:1100px;margin:0 auto;padding:36px 40px 28px;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:11.5px;line-height:1.35;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(16,24,40,.15)}
.i2-logo img{height:78px}
.i2-title{text-align:center;font-size:19px;font-weight:700;margin:10px 0 16px}
.i2-boxes{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.i2-box{border:1px solid #000;border-collapse:collapse}
.i2-box:first-child{width:46%}.i2-box:last-child{width:39%}
.i2-box td{padding:1px 4px;vertical-align:top;border:0}
.i2-box td:first-child{white-space:nowrap;width:1%;padding-right:10px}
.i2-box td:nth-child(2){width:1%;padding:1px 2px}
.i2-tbl{width:100%;border-collapse:collapse;margin-top:28px;border:1px solid #000}
.i2-tbl th{background:#fde9c4;border:1px solid #000;border-bottom:2px solid #000;padding:4px;font-size:11px;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.i2-tbl td{border-left:1px solid #000;border-right:1px solid #000;padding:2px 4px;border-bottom:1px solid #999}
.i2-tbl .c{text-align:center}
.m span{display:inline-block}
.i2-tbl td.m,.i2-tot td.m{white-space:nowrap}
.i2-tbl td.m span:first-child,.i2-tot td.m span:first-child{float:left}
.i2-tbl td.m span:last-child,.i2-tot td.m span:last-child{float:right}
.i2-tot{width:100%;border-collapse:collapse;border:1px solid #000;border-top:0}
.i2-tot td{padding:2px 4px;border:1px solid #000}
.i2-tot td.tb{text-align:center;font-weight:700;font-style:italic;vertical-align:middle;width:auto}
.i2-tot td.lbl{width:100px;text-align:right;font-weight:700;border-right:0}
.i2-tot td.m{width:124px;font-weight:700}
.i2-tot tr.gt td.lbl,.i2-tot tr.gt td.m{background:#ffff00;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.i2-foot{display:flex;justify-content:space-between;margin-top:30px;padding:0 24px}
.i2-bank>b{display:block}
.i2-bank u{display:block;font-style:italic;margin-bottom:2px}
.i2-bank{flex:1}
.i2-bank td{padding:0 18px 0 0;font-size:11.5px;white-space:nowrap}
.i2-sign{text-align:center;min-width:180px;margin-right:30px}
.i2-sig{height:100px;display:flex;align-items:center;justify-content:center}
.i2-sig img{max-height:100px;max-width:200px}
.i2-sign b{display:block;border-bottom:1px solid #000;padding:0 20px 2px}
.i2-company{margin-top:auto;padding-top:40px;font-size:10px;line-height:1.4}
/* laporan CCG */
.rep{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#000;font-size:11.5px}
.rp-top{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:12px}
.rp-top img{height:64px}
.rp-tt{text-align:right}
.rp-title{font-size:18px;font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.rp-meta{margin:8px 0 14px;color:#333}
.rp-sum{display:flex;gap:10px;margin-bottom:16px}
.rp-sum div{flex:1;border:1px solid #bbb;padding:8px 10px}
.rp-sum span{display:block;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.04em}
.rp-sum b{font-size:15px}
.rp-h{font-size:13px;margin:16px 0 6px}
.rp-tbl{width:100%;border-collapse:collapse}
.rp-tbl th{background:#fde9c4;border:1px solid #000;padding:4px 6px;font-size:11px;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp-tbl td{border:1px solid #999;padding:3px 6px}
.rp-tbl .r{text-align:right}
.rp-tbl tfoot td{font-weight:700;border-top:2px solid #000}
.rp-note{margin-top:14px;font-size:10.5px;color:#444}
/* bukti foto */
.bk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.bk-grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1200px){.bk-grid{grid-template-columns:repeat(6,1fr)}}
.bk-card{position:relative;overflow:hidden}
@media (max-width:699px){.day-h:has(+.bk-grid){flex-wrap:wrap;gap:6px}}
.bk-img{aspect-ratio:1/1;background:var(--line2);cursor:pointer}
.bk-img img{width:100%;height:100%;object-fit:cover;display:block}
.bk-img img:not([src]){visibility:hidden}
.bk-cap{padding:8px 10px}
.bk-cap b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-cap small{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-del{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.9)}
.bk-prev{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}
.bk-prev img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.bk-rep{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#000;font-size:11.5px}
.bk-day{margin-top:14px}
.bk-pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bk-pgrid figure{margin:0;border:1px solid #bbb;padding:6px;break-inside:avoid;page-break-inside:avoid}
.bk-pgrid img{width:100%;height:95mm;object-fit:contain;background:#f4f4f4;display:block}
.bk-pgrid figcaption{padding-top:5px;font-size:11px}
.bk-pgrid figcaption b{display:block;font-size:12px}
.bk-pgrid figcaption span{display:block;color:#333}
#print{display:none}
@media print{
  @page{size:A4;margin:8mm}
  html,body{background:#fff}
  nav.tabs,.shell,#sheet,#toast,#savebar,#dlg{display:none!important}
  #print{display:block!important}
  #print .inv2{box-shadow:none;width:auto;min-height:279mm;padding:6mm 8mm}
}
/* ===== tema krem-emas (gaya Coretax) ===== */
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d1b18;--ink2:#4a453d;--ink3:#7a7264;--line:#e4ddd0;--line2:#f1ece2;--accent:#9a7224;--accent-soft:#f6ecd5;--gold:#c69a3e;--cream:#fbf7ee}
.logo,.side-brand img{background:none!important;border-radius:0!important;object-fit:contain!important}
header.top{background:var(--cream);border-top:3px solid #1d1b18;border-bottom:1px solid var(--line);backdrop-filter:none}
.brand p{color:var(--accent);font-weight:600;letter-spacing:.4px;text-transform:uppercase;font-size:10.5px}
.month{background:#fff;border-color:#e1d9ca}
.month button{color:var(--accent)}
nav.tabs{background:var(--cream);border-top:1px solid var(--line)}
nav.tabs button{color:var(--ink3)}
nav.tabs button.on{color:var(--accent);font-weight:600}
.tbl th{background:#f7f4ee;color:var(--ink2);border-bottom-color:var(--line)}
.tbl tfoot td{background:#f7f4ee}
.btn.pri{background:#a87a26}
.btn.sec{border-color:#d9cfbd}
.btn.sec:hover,.btn.ghost:hover{background:#f6efe1}
.fchips button.on{background:#a87a26!important;color:#fff!important;border-color:#a87a26!important}
@media (min-width:900px){
  nav.tabs{top:0;left:0;right:0;bottom:auto;width:auto;height:64px;flex-direction:row;align-items:center;gap:16px;padding:0 24px;border-right:0;border-top:3px solid #1d1b18;border-bottom:1px solid var(--line)}
  .side-brand{padding:0;margin-right:10px;flex:none}
  .side-brand img{width:42px;height:42px}
  .side-brand b{font-size:15px}
  .side-brand span{color:var(--accent);font-weight:600;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase}
  nav.tabs .in{flex-direction:row;gap:0;flex:1;height:100%;align-items:stretch;overflow-x:auto}
  nav.tabs button{height:100%;border-radius:0;padding:0 14px;font-size:13.5px;color:var(--ink2);background:none!important}
  nav.tabs button svg{display:none}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--ink);background:none!important;box-shadow:inset 0 -3px 0 var(--gold)}
  .side-foot{margin:0;padding:0;text-align:right;flex:none;color:var(--ink2)}
  .shell{margin-left:0!important;padding-top:64px}
  header.top{top:64px;background:#fff;border-top:0}
  .hd{padding:10px 32px}
  .ptitle{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}
  .ptitle::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--gold)}
}
/* pembayaran */
.pseg3{display:grid;gap:10px;margin-top:14px}
@media (min-width:900px){.pseg3{grid-template-columns:repeat(3,1fr)}}
.pseg{text-align:left;padding:14px 16px;background:var(--cream);transition:box-shadow .15s}
.pseg b{font-size:14px}
.pseg.on{background:#fff;border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.pseg .pv{font-size:20px;font-weight:700;margin-top:1px}
@media (max-width:899px){.pseg3{grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory}.pseg{scroll-snap-align:start}}
.pfil{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 10px}
.pfil .fchips{margin:0}
.pgrps{display:flex;flex-direction:column;gap:12px;padding-bottom:110px}
.pgrp{overflow:hidden}
.pg-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;background:var(--cream);border-bottom:1px solid var(--line2)}
.pg-h b{font-size:14px}
.pg-h small{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.pcb{width:20px;height:20px;accent-color:#a87a26;cursor:pointer;flex:none}
.pok{display:inline-block;width:20px;text-align:center;color:var(--green);font-weight:700;flex:none}
tr.psel td,.prow.psel{background:#fdf6e3}
tr.pdone td,.prow.pdone{color:var(--ink3)}
.prow{cursor:pointer;align-items:flex-start}
.prow .pcb,.prow .pok{margin-top:2px}
.prow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.paybar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:40;padding:0 10px;pointer-events:none}
.pb-in{pointer-events:auto;max-width:1176px;margin:0 auto;background:#fff;border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(60,40,0,.18);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.pb-t b{display:block;font-size:14px}.pb-t span{font-size:12.5px;color:var(--ink2)}.pb-t span b{display:inline;color:var(--ink)}
.pb-d{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--ink2);font-weight:600}
.pb-d input{height:36px;width:150px}
.pb-b{display:flex;gap:8px;grid-column:1/-1}
.pb-b .btn.pri{flex:1}
@media (min-width:900px){.paybar{bottom:16px}.pb-in{grid-template-columns:1fr auto auto}.pb-b{grid-column:auto}.pb-b .btn.pri{flex:none;padding:0 22px}}
/* halaman masuk beranimasi */
body.authmode header.top{display:none}
body.authmode .shell{padding-top:0!important}
body.authmode .wrap{max-width:none;padding:0}
.lg-wrap{min-height:100vh;display:flex;flex-wrap:wrap;background:var(--bg);border-top:3px solid #1d1b18}
.lg-art{flex:1 1 560px;background:var(--cream);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:40px 48px;position:relative;overflow:hidden;min-height:520px}
.lg-co{display:flex;align-items:center;gap:12px;font-weight:700;position:relative}
.lg-co img{width:40px;height:40px;object-fit:contain}
.lg-mid{display:flex;flex-direction:column;align-items:center;gap:26px;position:relative}
.lg-stage{position:relative;width:340px;height:340px;display:flex;align-items:center;justify-content:center}
.lg-halo{position:absolute;inset:40px;border-radius:50%;background:radial-gradient(circle,rgba(233,203,124,.55),rgba(233,203,124,0) 70%);animation:lgpulse 3s ease-in-out infinite}
.lg-ring1{position:absolute;inset:0;border-radius:50%;border:1.5px dashed #d9b96c;animation:lgspin 18s linear infinite}
.lg-ring2{position:absolute;inset:22px;border-radius:50%;border:1px solid #e8d6ab;border-top-color:#b8862f;border-right-color:#b8862f;animation:lgspinr 10s linear infinite}
.lg-orb{position:absolute;inset:-12px;animation:lgspin 6s linear infinite}
.lg-orb span{position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#b8862f;box-shadow:0 0 12px 3px rgba(233,203,124,.9)}
.lg-gl{position:absolute;width:18px;height:18px;animation:lgglint 2.6s ease-in-out infinite}
.lg-logo{position:relative;width:220px;height:240px;animation:lgfloat 4s ease-in-out infinite}
.lg-logo img{width:100%;height:100%;object-fit:contain;display:block}
.lg-sheen{position:absolute;inset:0;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;overflow:hidden}
.lg-sheen::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,248,225,.85),rgba(255,255,255,0));animation:lgsheen 3s ease-in-out infinite}
.lg-art h1{font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-.6px;text-align:center}
.lg-art h1 span{color:var(--accent)}
.lg-caps{position:relative;height:28px;width:100%;max-width:420px}
.lg-caps div{position:absolute;left:0;right:0;text-align:center;font-size:15px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);opacity:0;animation:lgcap 10s infinite}
.lg-caps div:nth-child(2){animation-delay:2.5s}.lg-caps div:nth-child(3){animation-delay:5s}.lg-caps div:nth-child(4){animation-delay:7.5s}
.lg-foot{font-size:12px;color:var(--ink2);position:relative}
.lg-bubs{position:absolute;inset:0;pointer-events:none}
.lg-bub{position:absolute;bottom:-20px;border-radius:50%;border:1.5px solid #c69a3e;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(233,203,124,.35) 60%,rgba(233,203,124,.1));animation:lgbub 7s linear infinite}
.lg-side{flex:1 1 400px;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.lg-form{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:30px;box-shadow:0 10px 30px rgba(40,30,10,.06)}
.lg-form h2{font-size:22px;font-weight:700}
.lg-form>p{color:var(--ink2);font-size:13.5px;margin:6px 0 20px}
.lg-form .fld{display:block;margin-bottom:14px}
.lg-form .fld span{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.lg-form input{height:42px}
.lg-help{text-align:center;font-size:12px;color:var(--ink3);margin-top:16px}
.lg-r1{animation:lgrise .8s ease-out both}.lg-r2{animation:lgrise .8s .25s ease-out both}.lg-r3{animation:lgrise .8s .5s ease-out both}.lg-r4{animation:lgrise .8s .4s ease-out both}
@media (max-width:700px){.lg-art{padding:24px 20px;min-height:0}.lg-stage{width:240px;height:240px}.lg-logo{width:150px;height:165px}.lg-art h1{font-size:30px}.lg-gl{display:none}}
@keyframes lgspin{to{transform:rotate(360deg)}}
@keyframes lgspinr{to{transform:rotate(-360deg)}}
@keyframes lgfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes lgsheen{0%,55%{transform:translateX(-120%) skewX(-20deg)}85%,100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes lgpulse{0%,100%{opacity:.25;transform:scale(.92)}50%{opacity:.6;transform:scale(1.04)}}
@keyframes lgrise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lgcap{0%{opacity:0;transform:translateY(8px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes lgglint{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@keyframes lgbub{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:.75}50%{transform:translate(14px,-320px) scale(1)}90%{opacity:.5}100%{transform:translate(-8px,-640px) scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){.lg-wrap *{animation:none!important}.lg-caps div:first-child{opacity:1}}
</style>

<script>

const CODE_GS = "/**\n * Server data untuk aplikasi \"Rekap Order MGJA\".\n * 1) Tempel seluruh kode ini di Code.gs (Apps Script milik Google Sheet Anda).\n * 2) Terapkan (Deploy) sebagai Aplikasi Web: Jalankan sebagai \"Saya\", akses \"Siapa saja\".\n * 3) Salin URL Web App, tempel di aplikasi Rekap-Order-MGJA.html, lalu tekan Sambungkan.\n */\n\nconst SHEET_DATA = 'data';\nconst DILINDUNGI = ['config/main', 'config/ttd'];   /* hanya admin */\nconst SESI_HARI = 30;\nconst props_ = () => PropertiesService.getScriptProperties();\nfunction users_() { try { return JSON.parse(props_().getProperty('USERS') || '{}'); } catch (e) { return {}; } }\nfunction simpanUsers_(u) { props_().setProperty('USERS', JSON.stringify(u)); }\nfunction sesiAll_() { try { return JSON.parse(props_().getProperty('SESI') || '{}'); } catch (e) { return {}; } }\nfunction hash_(pw, salt) {\n  let h = salt + '|' + pw;\n  for (let i = 0; i < 300; i++) h = Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, h + '|' + pw));\n  return h;\n}\nfunction sesi_(token) {\n  if (!token) return null;\n  const all = sesiAll_(), s = all[token];\n  if (!s || s.exp < Date.now()) return null;\n  const u = users_()[s.u];\n  return u ? { u: s.u, nama: u.nama, role: u.role } : null;\n}\nfunction buatSesi_(uname) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const all = sesiAll_(), now = Date.now();\n    Object.keys(all).forEach(function (k) { if (all[k].exp < now) delete all[k]; });\n    const keys = Object.keys(all); if (keys.length > 150) keys.sort(function (a, b) { return all[a].exp - all[b].exp; }).slice(0, keys.length - 150).forEach(function (k) { delete all[k]; });\n    const token = Utilities.getUuid() + Utilities.getUuid().replace(/-/g, '');\n    all[token] = { u: uname, exp: now + SESI_HARI * 864e5 };\n    props_().setProperty('SESI', JSON.stringify(all));\n    return token;\n  } finally { lock.releaseLock(); }\n}\nfunction hapusSesi_(token, uname) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const all = sesiAll_();\n    Object.keys(all).forEach(function (k) { if (k === token || (uname && all[k].u === uname)) delete all[k]; });\n    props_().setProperty('SESI', JSON.stringify(all));\n  } finally { lock.releaseLock(); }\n}\nconst okUser_ = u => /^[a-z0-9._-]{3,30}$/.test(u);\nfunction setUser_(users, uname, nama, role, pw) {\n  const salt = Utilities.getUuid();\n  users[uname] = { nama: String(nama || uname).slice(0, 60), role: role === 'admin' ? 'admin' : 'staf', salt: salt, hash: hash_(pw, salt) };\n}\n\nfunction doGet(e) {\n  const p = (e && e.parameter) || {};\n  // Permintaan data dari file aplikasi (.html) yang dibuka di luar Google\n  if ('key' in p || 't' in p) {\n    return json_(apiCall({ token: p.token || '' }));\n  }\n  // Selain itu: server aktif (file aplikasi .html yang dipakai untuk membuka data)\n  return ContentService.createTextOutput('Server data Rekap Order MGJA aktif. Tempel URL ini di aplikasi Rekap-Order-MGJA.html lalu tekan Sambungkan.');\n}\n\nfunction doPost(e) {\n  let body;\n  try { body = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'Permintaan tidak valid' }); }\n  delete body.key;\n  return json_(apiCall(body));\n}\n\nfunction apiCall(body) {\n  body = body || {};\n  const users = users_();\n  const kosong = Object.keys(users).length === 0;\n  if (body.setup) {\n    if (!kosong) return { ok: false, error: 'Akun admin sudah dibuat. Silakan masuk.' };\n    const s = body.setup, un = String(s.u || '').trim().toLowerCase();\n    if (!okUser_(un)) return { ok: false, error: 'Username 3–30 huruf kecil/angka, tanpa spasi' };\n    if (String(s.p || '').length < 6) return { ok: false, error: 'Password minimal 6 karakter' };\n    setUser_(users, un, s.nama, 'admin', String(s.p)); simpanUsers_(users);\n    const tk = buatSesi_(un); return { ok: true, token: tk, me: { u: un, nama: users[un].nama, role: 'admin' } };\n  }\n  if (body.login) {\n    const un = String(body.login.u || '').trim().toLowerCase(), x = users[un];\n    if (!x || hash_(String(body.login.p || ''), x.salt) !== x.hash) { Utilities.sleep(800); return { ok: false, error: 'Username atau password salah' }; }\n    const tk = buatSesi_(un); return { ok: true, token: tk, me: { u: un, nama: x.nama, role: x.role } };\n  }\n  if (kosong) return { ok: false, error: 'SETUP' };\n  const me = sesi_(body.token);\n  if (!me) return { ok: false, error: 'LOGIN' };\n  const admin = me.role === 'admin';\n  if (body.logout) { hapusSesi_(body.token); return { ok: true }; }\n  if (body.gantiPw) {\n    const x = users[me.u];\n    if (hash_(String(body.gantiPw.lama || ''), x.salt) !== x.hash) return { ok: false, error: 'Password lama salah' };\n    if (String(body.gantiPw.baru || '').length < 6) return { ok: false, error: 'Password baru minimal 6 karakter' };\n    setUser_(users, me.u, x.nama, x.role, String(body.gantiPw.baru)); simpanUsers_(users); return { ok: true };\n  }\n  if (body.users) {\n    if (!admin) return { ok: false, error: 'Hanya admin yang bisa mengelola pengguna' };\n    const a = body.users;\n    if (a.aksi === 'simpan') {\n      const un = String(a.u || '').trim().toLowerCase();\n      if (!okUser_(un)) return { ok: false, error: 'Username 3–30 huruf kecil/angka, tanpa spasi' };\n      if (!users[un] || a.p) { if (String(a.p || '').length < 6) return { ok: false, error: 'Password minimal 6 karakter' }; setUser_(users, un, a.nama, a.role, String(a.p)); if (users[un]) hapusSesi_('', un); }\n      else { users[un].nama = String(a.nama || un).slice(0, 60); users[un].role = a.role === 'admin' ? 'admin' : 'staf'; }\n      if (un === me.u) users[un].role = 'admin';\n      simpanUsers_(users);\n    } else if (a.aksi === 'hapus') {\n      const un = String(a.u || '');\n      if (un === me.u) return { ok: false, error: 'Tidak bisa menghapus akun sendiri' };\n      delete users[un]; simpanUsers_(users); hapusSesi_('', un);\n    }\n    const list = Object.keys(users).sort().map(function (k) { return { u: k, nama: users[k].nama, role: users[k].role }; });\n    return { ok: true, users: list };\n  }\n  if (body.bukti) { try { return bukti_(body, me); } catch (err) { return { ok: false, error: 'Google Drive belum diizinkan. Buka Apps Script, pilih fungsi izinkanDrive, lalu klik Jalankan. (' + err.message + ')' }; } }\n  if (!body.ops) {\n    let url = '';\n    try { url = ScriptApp.getService().getUrl(); } catch (err) {}\n    return { ok: true, data: bacaSemua_(), url: url, me: me };\n  }\n  if (!admin && body.ops.some(function (o) { return DILINDUNGI.indexOf(o.path) >= 0; })) {\n    return { ok: false, error: 'Pengaturan hanya bisa diubah oleh admin.' };\n  }\n  tulis_(body.ops);\n  return { ok: true };\n}\n\nfunction tulis_(ops) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(25000);\n  try {\n    const sh = sheet_();\n    const v = sh.getDataRange().getValues();\n    const map = new Map();\n    for (let i = 1; i < v.length; i++) if (v[i][0]) map.set(v[i][0], [v[i][1], v[i][2]]);\n    for (const op of ops) {\n      if (op.op === 'set') map.set(op.path, [JSON.stringify(op.data), new Date()]);\n      else if (op.op === 'delete') map.delete(op.path);\n    }\n    const rows = [['path', 'json', 'diperbarui']];\n    map.forEach(function (val, k) { rows.push([k, val[0], val[1]]); });\n    sh.clearContents();\n    sh.getRange(1, 1, rows.length, 3).setValues(rows);\n    SpreadsheetApp.flush();\n    try { susunTampilan_(); } catch (err) { /* tampilan hanya bonus */ }\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/* ---------- foto bukti (Google Drive) ---------- */\nfunction izinkanDrive() { return folder_().getName(); }   /* jalankan sekali dari editor untuk memberi izin Drive */\nfunction folder_() {\n  const p = props_(); const id = p.getProperty('FOLDER_BUKTI');\n  if (id) { try { return DriveApp.getFolderById(id); } catch (e) {} }\n  const f = DriveApp.createFolder('Bukti Rekap Order MGJA'); p.setProperty('FOLDER_BUKTI', f.getId()); return f;\n}\nfunction simpanFoto_(b64, nama) { return folder_().createFile(Utilities.newBlob(Utilities.base64Decode(b64), 'image/jpeg', nama)).getId(); }\nfunction bukti_(body, me) {\n  const b = body.bukti, admin = me.role === 'admin';\n  if (b.aksi === 'unggah') {\n    const m = b.meta || {};\n    if (!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(String(m.tanggal || ''))) return { ok: false, error: 'Tanggal tidak valid' };\n    if (!b.foto) return { ok: false, error: 'Foto kosong' };\n    const id = 'b' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);\n    const nama = m.tanggal + '_' + String(m.tenantName || 'tanpa-tenant').replace(/[^A-Za-z0-9]+/g, '-') + '_' + id;\n    const fileId = simpanFoto_(b.foto, nama + '.jpg');\n    const thumbId = b.thumb ? simpanFoto_(b.thumb, nama + '_kecil.jpg') : fileId;\n    const doc = { tanggal: m.tanggal, bulan: m.tanggal.slice(0, 7), tenantId: m.tenantId || '', tenantName: m.tenantName || '', catatan: String(m.catatan || '').slice(0, 200), fileId: fileId, thumbId: thumbId, oleh: me.u, createdAt: Date.now() };\n    tulis_([{ op: 'set', path: 'bukti/' + id, data: doc }]);\n    return { ok: true, id: id, doc: doc };\n  }\n  if (b.aksi === 'ambil') {\n    const out = {}; let total = 0;\n    (b.ids || []).slice(0, 40).forEach(function (fid) {\n      if (total > 30e6) return;\n      try { const s = Utilities.base64Encode(DriveApp.getFileById(fid).getBlob().getBytes()); out[fid] = s; total += s.length; } catch (e) { out[fid] = ''; }\n    });\n    return { ok: true, foto: out };\n  }\n  if (b.aksi === 'hapus') {\n    const all = bacaSemua_(), d = all['bukti/' + b.id];\n    if (!d) return { ok: true };\n    if (!admin && d.oleh !== me.u) return { ok: false, error: 'Hanya admin atau pengunggah yang bisa menghapus foto ini' };\n    [d.fileId, d.thumbId].forEach(function (fid) { try { DriveApp.getFileById(fid).setTrashed(true); } catch (e) {} });\n    tulis_([{ op: 'delete', path: 'bukti/' + b.id }]);\n    return { ok: true };\n  }\n  return { ok: false, error: 'Aksi tidak dikenal' };\n}\n\nfunction sheet_() {\n  const ss = SpreadsheetApp.getActive();\n  let sh = ss.getSheetByName(SHEET_DATA);\n  if (!sh) { sh = ss.insertSheet(SHEET_DATA); sh.appendRow(['path', 'json', 'diperbarui']); sh.setFrozenRows(1); }\n  return sh;\n}\n\nfunction bacaSemua_() {\n  const v = sheet_().getDataRange().getValues();\n  const out = {};\n  for (let i = 1; i < v.length; i++) {\n    if (!v[i][0]) continue;\n    try { out[v[i][0]] = JSON.parse(v[i][1]); } catch (err) {}\n  }\n  return out;\n}\n\n/* Lembar \"Order\" dan \"Pembayaran\" yang mudah dibaca, disusun ulang setiap ada perubahan. */\nfunction susunTampilan_() {\n  const all = bacaSemua_();\n  const ss = SpreadsheetApp.getActive();\n  const orders = [];\n  const pays = [];\n  const SEG = { dist: 'MGJA → Coca Cola Group', kop: 'Koperasi → MGJA', tenan: 'Tenan → Koperasi' };\n  Object.keys(all).forEach(function (k) {\n    const d = all[k];\n    if (k.indexOf('orders/') === 0) (d.items || []).forEach(function (i) {\n      orders.push([d.tanggal, d.bulan, d.tenantName, i.name, i.pkg, i.qty, i.hd, i.hk, i.ht, i.qty * i.hd, i.qty * i.hk, i.qty * i.ht]);\n    });\n    if (k.indexOf('payments/') === 0) pays.push([d.tanggal, d.periode, SEG[d.segmen] || d.segmen, d.tenantName || '', d.jumlah, d.catatan || '']);\n  });\n  const byDate = function (a, b) { return String(a[0]).localeCompare(String(b[0])); };\n  orders.sort(byDate); pays.sort(byDate);\n  orders.unshift(['Tanggal', 'Bulan', 'Tenan', 'Produk', 'Kemasan', 'Karton', 'Harga CCG', 'Harga Koperasi', 'Harga Tenan', 'Total CCG', 'Total Koperasi', 'Total Tenan']);\n  pays.unshift(['Tanggal bayar', 'Untuk bulan', 'Alur', 'Tenan', 'Jumlah', 'Catatan']);\n  [['Order', orders], ['Pembayaran', pays]].forEach(function (x) {\n    let sh = ss.getSheetByName(x[0]);\n    if (!sh) sh = ss.insertSheet(x[0]);\n    sh.clearContents();\n    sh.getRange(1     if (pending) return;
    const s = JSON.stringify(j.data || {});
    if (s !== last) { last = s; store = j.data || {}; notify(); }
  }
  function send(ops) {
    pending++;
    const p = chain.then(() => api(conn, { ops }));
    chain = p.catch(() => {});
    return p.finally(() => { pending--; }).catch(e => { last = ''; pull().catch(() => {}); throw e; });
  }
  const ready = pull();
  setInterval(() => { if (document.visibilityState === 'visible' && !S.form && !S.pay) pull().catch(() => {}); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull().catch(() => {}); });
  const meta = { fromCache: false, hasPendingWrites: false };
  const snapDoc = p => ({ id: p.split('/').pop(), exists: p in store, data: () => store[p], metadata: meta });

    id: p.split('/').pop(), path: p,

    set: d => { store[p] = clone(d); notify(); return send([{ op: 'set', path: p, data: clone(d) }]); },
    update: d => { if (!(p in store)) return Promise.reject({ code: 'invalid_argument', message: 'Data tidak ditemukan' }); store[p] = { ...store[p], ...clone(d) }; notify(); return send([{ op: 'set', path: p, data: clone(store[p]) }]); },

  });

    where: (f, op, v) => q(c, [...filters, [f, v]]),
    doc: id => docRef(c + '/' + (id || ('d' + Date.now().toString(36) + uid()))),
    onSnapshot: f => {
      const s = () => {
        const depth = c.split('/').length + 1;
        const docs = Object.keys(store).filter(k => k.startsWith(c + '/') && k.split('/').length === depth && filters.every(([a, v]) => store[k][a] === v)).map(snapDoc);

/* ---------- render ---------- */
const DESK_MQ = window.matchMedia('(min-width: 900px)');
const isDesk = () => DESK_MQ.matches;
try { DESK_MQ.addEventListener('change', () => render()); } catch (_) {}
const TABS = [['order', 'Order', 'Order'], ['rekap', 'Rekap', 'Rekap bulanan'], ['bayar', 'Pembayaran', 'Pembayaran & jatuh tempo'], ['invoice', 'Invoice', 'Invoice'], ['harga', 'Pengaturan', 'Harga, tenan & pengaturan']];

function render() {
  $('#mlabel').textContent = monthLabel(S.month);

  $('#ptitle').textContent = (TABS.find(t => t[0] === S.tab) || [])[2] || '';
  const m = $('#main');
  $('#savebar').innerHTML = '';
  const isSetup = S.status === 'setup' || S.status === 'login' || S.status === 'firstadmin';
  const sf = document.querySelector('.side-foot');

  document.querySelector('nav.tabs').style.display = isSetup ? 'none' : '';
  document.body.classList.toggle('authmode', S.status === 'login');
  document.querySelector('.month').style.visibility = isSetup ? 'hidden' : '';
  document.querySelector('#ptitle').style.visibility = isSetup ? 'hidden' : '';
  if (S.status === 'setup') { renderSetup(m); return; }
  if (S.status === 'login') { renderLogin(m); return; }
  if (S.status === 'firstadmin') { renderFirstAdmin(m); return; }
  if (S.status === 'connerr') { m.innerHTML = `<div class="state"><b>Tidak bisa membuka data</b>${esc(S.err)}<div class="row" style="justify-content:center;gap:8px;margin-top:18px"><button class="btn sec" data-act="retryConn">Coba lagi</button><button class="btn pri" data-act="changeConn">Ubah koneksi</button></div></div>`; return; }
  if (S.status === 'nodb') { m.innerHTML = `<div class="state"><b>Penyimpanan data belum tersedia</b>Buka aplikasi ini dari link Claude dalam keadaan sudah masuk (login) ke akun Anda agar data order bisa disimpan.</div>`; return; }
  if (S.status === 'err') { m.innerHTML = `<div class="state"><b>Data tidak bisa dimuat</b>${esc(S.err)}</div>`; return; }

}

function priceWarn() {
  const missing = products().filter(p => !p.hk || !p.ht).length;
  if (!missing) return '';
  return `<div class="warn">${missing} produk belum memiliki harga ke koperasi/tenan, sehingga nilai rupiahnya masih 0. <button data-act="tab" data-v="harga">Lengkapi harga</button></div>`;
}
const isFree = o => o.jenis === 'gratis';
const ppnRate = () => (+company().ppn || 0) / 100;
const net = x => (x || 0) / (1 + ppnRate());
const kpi = (l, v, s, cls = '') => `<div class="card kpi"><div class="l">${l}</div><div class="v num ${cls}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
function shortPkg(p) { return String(p || '').replace(/\s*[×x]\s*\d+\s*$/i, '').replace(/^(PET|Kaleng)\s*/i, ''); }
const itemsText = o => (o.items || []).map(i => `${i.name} ${shortPkg(i.pkg)} ×${i.qty}${i.unit === 'btl' ? ' btl' : ''}`).join(', ');
function tenanStatus(D) {
  const today = todayStr(), map = {};
  for (const x of D) if (x.seg === 'tenan') map[x.o.id] = x;
  return o => {
    if (isFree(o)) return '<span class="badge free">Gratis</span>';
    const x = map[o.id];
    if (!x || !x.amt) return '<span class="muted">—</span>';
    if (x.sisa <= 0) return '<span class="badge ok">Lunas</span>';
    return x.due < today ? `<span class="badge late">Lewat ${dayDiff(x.due, today)} hari</span>` : `<span class="badge nil">s/d ${fmtShort(x.due)}</span>`;
  };
}

function renderOrder(m) {

  else if (isDesk()) {

      ${list.map(o => `<tr class="click" data-act="editOrder" data-id="${esc(o.id)}"><td class="num">${fmtShort(o.tanggal)}</td><td><b style="font-weight:600">${esc(o.tenantName)}</b></td><td><div class="ell">${esc(itemsText(o))}</div></td><td class="r num">${isFree(o) ? qtyLabel(o) : num(o.totalQty)}</td><td class="r num">${rp(o.totalHt)}</td><td>${st(o)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="3">Jumlah${fr.qty ? ` <span class="muted small">(tanpa ${num(fr.qty)} karton gratis)</span>` : ''}</td><td class="r num">${num(a.qty)}</td><td class="r num">${rp(a.ht)}</td><td></td></tr></tfoot></table></div>`;
  } else {
    let cur = '';
    const dayTot = {};
    list.forEach(o => dayTot[o.tanggal] = (dayTot[o.tanggal] || 0) + (o.totalQty || 0));
    let open = false;
    for (const o of list) {
      if (o.tanggal !== cur) {
        if (open) h += '</div>';
        cur = o.tanggal; h += `<div class="day-h"><span>${fmtDate(cur)}</span><span class="num">${fmtK(dayTot[cur])} krt</span></div><div class="card">`; open = true;
      }
      h += `<button class="li" data-act="editOrder" data-id="${esc(o.id)}"><div class="nm"><b>${esc(o.tenantName)}</b><small>${esc(itemsText(o))}</small></div>
        <div class="rt"><b class="num">${isFree(o) ? qtyLabel(o) : num(o.totalQty) + ' krt'}</b>${st(o)}</div></button>`;
    }
    if (open) h += '</div>';
  }
  m.innerHTML = h;
}

function renderRekap(m) {

  const labaBersih = net(a.hk - a.hd) - net(fr.hd);
  const n = daysIn(S.month);
  const max = Math.max(1, ...Object.values(all.byDay));

  let bars = '', xs = '';
  for (let d = 1; d <= n; d++) {

    bars += `<div class="${v ? '' : 'z'} ${isT ? 'today' : ''}" style="height:${v ? Math.max(4, v / max * 100) : 2}%" title="${d} ${BULAN[+S.month.slice(5) - 1]}: ${v} karton"></div>`;

  m.innerHTML = `
    <div class="toolbar"><div class="caption grow">Ringkasan order ${monthLabel(S.month)}.</div><button class="btn sec" data-act="copyRekap">Salin rekap (WhatsApp)</button><button class="btn pri" data-act="openCcg">Laporan untuk Coca Cola Group</button></div>

    <div class="kpis six">
      ${kpi('Karton terjual', num(a.qty), `${a.n} order${fr.qty ? ` · + ${fmtK(fr.qty)} krt gratis` : ''}`)}
      ${kpi('Laba bersih MGJA', rp(labaBersih), `Setelah PPN ${+company().ppn || 0}%${fr.hd ? ' & barang gratis' : ''}`, labaBersih < 0 ? '' : 'pos')}
      ${kpi('Laba kotor penjualan', rp(a.hk - a.hd), 'Harga koperasi − harga CCG')}
      ${kpi('Barang gratis', rp(fr.hd), `setara ${fmtK(fr.qty)} karton · biaya modal`)}
      ${kpi('Tagihan ke koperasi', rp(a.hk), `Penjualan tenan ${rp(a.ht)}`)}
      ${kpi('Total bayar ke CCG', rp(a.hd + fr.hd), fr.hd ? `Termasuk gratis ${rp(fr.hd)}` : `Sebelum PPN ${rp(net(a.hd))}`)}

    <div class="grid2">
      <div><h2 class="sec">Per tenan</h2>
      <div class="card tblwrap"><table class="tbl"><thead><tr><th>Tenan</th><th class="r">Karton</th><th class="r">Nilai tenan</th><th class="r">Laba bersih MGJA</th></tr></thead><tbody>
        ${trows.map(r => `<tr><td>${esc(r.name)}${r.n ? `<div class="small muted">${r.n} order</div>` : ''}</td><td class="r num">${num(r.qty)}</td><td class="r num">${rp(r.ht)}</td><td class="r num">${rp(net((r.hk || 0) - (r.hd || 0)))}</td></tr>`).join('')}

function freeTable() {
  const rows = {};
  for (const o of S.orders.filter(isFree)) for (const i of (o.items || [])) {
    const k = o.tenantId + '|' + i.pid;
    const r = rows[k] ||= { tenant: o.tenantName, name: `${i.name} ${shortPkg(i.pkg)}`, qty: 0, krt: 0, btl: 0, hd: 0, tgl: [] };
    r.qty += kq(i); if (i.unit === 'btl') r.btl += i.qty; else r.krt += i.qty; r.hd += i.qty * (i.hd || 0); if (!r.tgl.includes(o.tanggal)) r.tgl.push(o.tanggal);
  }
  const list = Object.values(rows).sort((x, y) => x.tenant.localeCompare(y.tenant) || x.name.localeCompare(y.name));
  if (!list.length) return '';
  const q = list.reduce((s, r) => s + r.qty, 0), c = list.reduce((s, r) => s + r.hd, 0);
  return `<h2 class="sec">Barang gratis dari MGJA <span class="muted small">tidak ditagih, biaya ditanggung MGJA</span></h2>
    <div class="card tblwrap"><table class="tbl"><thead><tr><th>Tenan</th><th>Produk</th><th>Tanggal</th><th class="r">Jumlah</th><th class="r">Biaya (modal CCG)</th></tr></thead><tbody>
    ${list.map(r => `<tr><td>${esc(r.tenant)}</td><td>${esc(r.name)}</td><td class="num muted">${r.tgl.sort().map(fmtShort).join(', ')}</td><td class="r num">${[r.krt ? num(r.krt) + ' krt' : '', r.btl ? num(r.btl) + ' btl' : ''].filter(Boolean).join(' + ')}</td><td class="r num">${rp(r.hd)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="3">Jumlah</td><td class="r num">setara ${fmtK(q)} krt</td><td class="r num">${rp(c)}</td></tr></tfoot></table></div>`;
}

function renderBayarLama(m) {

  m.innerHTML = `

function terbilang(n) {
  n = Math.floor(Math.abs(n || 0));
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const f = x => {
    if (x < 12) return s[x];
    if (x < 20) return f(x - 10) + ' belas';
    if (x < 100) return f(Math.floor(x / 10)) + ' puluh' + (x % 10 ? ' ' + f(x % 10) : '');
    if (x < 200) return 'seratus' + (x - 100 ? ' ' + f(x - 100) : '');
    if (x < 1000) return f(Math.floor(x / 100)) + ' ratus' + (x % 100 ? ' ' + f(x % 100) : '');
    if (x < 2000) return 'seribu' + (x - 1000 ? ' ' + f(x - 1000) : '');
    if (x < 1e6) return f(Math.floor(x / 1000)) + ' ribu' + (x % 1000 ? ' ' + f(x % 1000) : '');
    if (x < 1e9) return f(Math.floor(x / 1e6)) + ' juta' + (x % 1e6 ? ' ' + f(x % 1e6) : '');
    if (x < 1e12) return f(Math.floor(x / 1e9)) + ' miliar' + (x % 1e9 ? ' ' + f(x % 1e9) : '');
    return f(Math.floor(x / 1e12)) + ' triliun' + (x % 1e12 ? ' ' + f(x % 1e12) : '');
  };
  const t = n === 0 ? 'nol' : f(n);

function invCompute(st) {
  const co = company(), r = (+co.ppn || 0) / 100, incl = co.inklusif !== false;
  const used = invoicedIds();
  const all = S.orders.filter(o => o.jenis !== 'gratis' && o.tanggal >= st.dari && o.tanggal <= st.sampai && (!st.tenan || o.tenantId === st.tenan));
  const orders = all.filter(o => !used.has(o.id));

  lines.sort((a, b) => a.tgl.localeCompare(b.tgl) || a.tenant.localeCompare(b.tenant) || a.barang.localeCompare(b.barang));
  const subtotal = lines.reduce((s, l) => s + l.total, 0);

  lines.forEach(l => delete l.bruto);

}

function uploadTtd(file) {
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = async () => {
      let w = Math.min(420, img.width), url = '';
      for (let k = 0; k < 6; k++) {
        const cv = document.createElement('canvas'); cv.width = w; cv.height = Math.round(img.height * w / img.width);
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
        url = cv.toDataURL('image/jpeg', 0.85);
        if (url.length < 40000) break;
        w = Math.round(w * 0.75);
      }
      try { await db.doc('config/ttd').set({ img: url }); S.ttd = url; S.ttdLoaded = true; toast('Tanda tangan tersimpan'); render(); }
      catch (e) { toast('Gagal menyimpan gambar: ' + (e.message || e.code), true); }
    };
    img.onerror = () => toast('File bukan gambar', true);
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- faktur pajak (Coretax) ---------- */
const FP_DEF = { fpTrx: '04', fpKode: '000000', fpSatuan: 'UM.0037', fpTarif: 12, fpNilaiLain: true };
const fpCfg = () => { const c = company(); const o = {}; for (const k in FP_DEF) o[k] = c[k] ?? FP_DEF[k]; return o; };
const digits = s => String(s || '').replace(/\D/g, '');
const xesc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
function fpCompute(v) {
  const f = fpCfg(), rate = (+f.fpTarif || 0) / 100;
  const items = (v.lines || []).map(l => {
    const base = Math.round((l.harga || 0) * (l.qty || 0));
    const other = f.fpNilaiLain ? Math.round(base * 11 / 12) : base;
    return { name: `${l.barang} (${l.tenant})`, barang: l.barang, tenant: l.tenant, qty: l.qty, price: l.harga, base, other, vat: Math.round(other * rate) };
  });
  const sum = k => items.reduce((s, i) => s + i[k], 0);
  return { items, base: sum('base'), other: sum('other'), vat: sum('vat'), cfg: f };
}
function fpXml(list) {
  const co = company(), f = fpCfg();
  const sellerTin = digits(co.npwp);
  const inv = list.map(v => {
    const k = v.kepada || {}, buyerTin = digits(k.npwp || co.custNpwp), r = fpCompute(v);
    const goods = r.items.map(i => `        <GoodService>
          <Opt>A</Opt>
          <Code>${xesc(f.fpKode)}</Code>
          <Name>${xesc(i.name)}</Name>
          <Unit>${xesc(f.fpSatuan)}</Unit>
          <Price>${i.price}</Price>
          <Qty>${i.qty}</Qty>
          <TotalDiscount>0</TotalDiscount>
          <TaxBase>${i.base}</TaxBase>
          <OtherTaxBase>${i.other}</OtherTaxBase>
          <VATRate>${f.fpTarif}</VATRate>
          <VAT>${i.vat}</VAT>
          <STLGRate>0</STLGRate>
          <STLG>0</STLG>
        </GoodService>`).join('\n');
    return `    <TaxInvoice>
      <TaxInvoiceDate>${xesc(v.tanggal)}</TaxInvoiceDate>
      <TaxInvoiceOpt>Normal</TaxInvoiceOpt>
      <TrxCode>${xesc(f.fpTrx)}</TrxCode>
      <AddInfo/>
      <CustomDoc/>
      <RefDesc>${xesc(v.nomor)}</RefDesc>
      <FacilityStamp/>
      <SellerIDTKU>${sellerTin}000000</SellerIDTKU>
      <BuyerTin>${buyerTin}</BuyerTin>
      <BuyerDocument>TIN</BuyerDocument>
      <BuyerCountry>IDN</BuyerCountry>
      <BuyerDocumentNumber>-</BuyerDocumentNumber>
      <BuyerName>${xesc(k.nama || co.custNama)}</BuyerName>
      <BuyerAdress>${xesc(k.alamat || co.custAlamat)}</BuyerAdress>
      <BuyerEmail/>
      <BuyerIDTKU>${buyerTin}000000</BuyerIDTKU>
      <ListOfGoodService>
${goods}
      </ListOfGoodService>
    </TaxInvoice>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="utf-8"?>
<TaxInvoiceBulk xmlns:xsi="http:\/\/www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="TaxInvoice.xsd">
  <TIN>${sellerTin}</TIN>
  <ListOfTaxInvoice>
${inv}
  </ListOfTaxInvoice>
</TaxInvoiceBulk>
`;
}
function fpDownload(name, text) {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/xml' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('File XML tersimpan di folder Downloads');
  } catch (_) { copyBox('File XML faktur', text); }

/* ---------- laporan untuk Coca Cola Group (tanpa harga jual & laba) ---------- */
function dlFile(name, text, type) {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('File tersimpan di folder Downloads');
  } catch (_) { toast('Browser ini tidak mengizinkan unduhan', true); }
}
function ccgData(st) {
  const orders = S.orders.filter(o => o.tanggal >= st.dari && o.tanggal <= st.sampai && (st.gratis || !isFree(o)));
  const prod = {}, ten = {}, day = {};
  let jual = 0, free = 0, btl = 0, nilai = 0;
  for (const o of orders) {
    const fr = false;
    const t = ten[o.tenantId] ||= { name: o.tenantName, jual: 0, free: 0 };
    for (const i of (o.items || [])) {
      const k = kq(i), v = (i.qty || 0) * (i.hd || 0);
      const p = prod[i.pid] ||= { name: i.name, pkg: i.pkg, jual: 0, free: 0, btl: 0, nilai: 0, harga: i.unit === 'btl' ? (i.hd || 0) * (i.isi || 12) : (i.hd || 0) };
      if (fr) { p.free += k; t.free += k; free += k; if (i.unit === 'btl') { p.btl += i.qty; btl += i.qty; } }
      else { p.jual += k; t.jual += k; jual += k; }
      p.nilai += v; nilai += v;
      day[o.tanggal] = (day[o.tanggal] || 0) + k;
    }
  }
  return {
    orders, jual, free, btl, nilai,
    prod: Object.values(prod).sort((a, b) => a.name.localeCompare(b.name) || a.pkg.localeCompare(b.pkg)),
    ten: Object.values(ten).sort((a, b) => (b.jual + b.free) - (a.jual + a.free)),
    day: Object.entries(day).sort((a, b) => a[0].localeCompare(b[0])),
  };
}
const fK = x => fmtK(x);

const ccgPeriode = st => st.dari === st.sampai ? fmtLong(st.dari) : `${fmtLong(st.dari)} – ${fmtLong(st.sampai)}`;
function ccgText(st, d) {
  const L = [`*LAPORAN PEMBELIAN – ${company().nama.toUpperCase()}*`, `Untuk: Coca Cola Group`, `Periode: ${ccgPeriode(st)}`, '',
    `Total: ${fK(d.jual)} karton`, `Nilai pembelian: ${rp(d.nilai)}`, '', '*Per produk*'];
  d.prod.forEach(p => L.push(`- ${p.name} ${p.pkg}: ${fK(p.jual)} krt · ${rp(p.nilai)}`));
  if (st.tenant) { L.push('', '*Per tenant*'); d.ten.forEach(t => L.push(`- ${t.name}: ${fK(t.jual)} krt`)); }
  return L.join('\n');
}
function ccgCsv(st, d) {
  const cell = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const r1 = n => Math.round(n * 100) / 100;
  const rows = [[`Laporan pembelian ${company().nama} untuk Coca Cola Group`], [`Periode`, ccgPeriode(st)], [],
    ['Produk', 'Kemasan', 'Jumlah (karton)', 'Harga CCG per karton', 'Nilai pembelian']];
  d.prod.forEach(p => rows.push([p.name, p.pkg, r1(p.jual), Math.round(p.harga), Math.round(p.nilai)]));
  rows.push(['Jumlah', '', r1(d.jual), '', Math.round(d.nilai)]);
  if (st.tenant) { rows.push([], ['Tenant', 'Jumlah (karton)']); d.ten.forEach(t => rows.push([t.name, r1(t.jual)])); }
  if (st.harian) { rows.push([], ['Tanggal', 'Karton']); d.day.forEach(([t, k]) => rows.push([t, r1(k)])); }
  return '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
}

}

function dues() {
  const T = tempo(), out = [];
  const sorted = [...S.orders].sort((a, b) => a.tanggal.localeCompare(b.tanggal) || (a.createdAt || 0) - (b.createdAt || 0));
  const cov = { dist: new Set(), kop: new Set(), tenan: new Set() }, pool = { dist: 0, kop: 0 }, poolT = {};
  for (const p of S.payments) {
    if (Array.isArray(p.orderIds) && p.orderIds.length) { if (cov[p.segmen]) p.orderIds.forEach(id => cov[p.segmen].add(id)); }
    else if (p.segmen === 'tenan') poolT[p.tenantId] = (poolT[p.tenantId] || 0) + (p.jumlah || 0);
    else pool[p.segmen] = (pool[p.segmen] || 0) + (p.jumlah || 0);
  }
  const pour = (seg, list, box, key) => {
    for (const o of list) {
      const amt = o[SEG[seg].key] || 0, mark = cov[seg].has(o.id);
      let pd = amt;
      if (!mark) { pd = Math.min(amt, box[key] || 0); box[key] = (box[key] || 0) - pd; }
      out.push({ seg, o, amt, paid: pd, sisa: amt - pd, due: addWorkdays(o.tanggal, T[seg]), mark });
    }
  };
  pour('dist', sorted, pool, 'dist'); pour('kop', sorted, pool, 'kop');
  const byT = {}; sorted.forEach(o => (byT[o.tenantId] ||= []).push(o));
  for (const [id, l] of Object.entries(byT)) pour('tenan', l, poolT, id);
  return out;
}

  if (S.dirty) return toast('Simpan perubahan harga dulu', true);
  if (!S.orders.length) return toast('Belum ada order bulan ini');
  const ok = await confirmDlg(`Hitung ulang ${S.orders.length} order bulan ${monthLabel(S.month)} dengan harga yang tersimpan sekarang?`, 'Ya, hitung ulang');
  if (!ok) return;
  let n = 0;
  try {
    for (const o of S.orders) {
      const items = (o.items || []).map(i => { const p = products().find(x => x.id === i.pid); return p ? (o.jenis === 'gratis' ? { ...i, hd: i.unit === 'btl' ? (+p.hd || 0) / (i.isi || isiOf(p)) : p.hd, hk: 0, ht: 0 } : { ...i, hd: p.hd, hk: p.hk, ht: p.ht }) : i; });
      const t = tot(items);
      if (t.hd === o.totalHd && t.hk === o.totalHk && t.ht === o.totalHt) continue;
      await db.collection('orders').doc(o.id).update({ items, totalHd: t.hd, totalHk: t.hk, totalHt: t.ht, updatedAt: Date.now() });
      n++;
    }
    toast(n ? `${n} order diperbarui` : 'Semua order sudah memakai harga terbaru');
  } catch (e) { toast('Gagal memperbarui: ' + (e.message || e.code), true); }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'scrim') { if (e.target === el) closeSheet(); return; }
  if (a === 'tab') { S.tab = el.dataset.v; try { history.replaceState(null, '', '#' + S.tab); } catch (_) {} render(); window.scrollTo(0, 0); }
  else if (a === 'prevM' || a === 'nextM') {
    if (S.dirty && S.tab === 'harga') { /* draft not tied to month */ }
    const nm = shiftMonth(S.month, a === 'prevM' ? -1 : 1);
    if (nm < START_MONTH) { toast('Data order dimulai Oktober 2026'); return; }
    S.month = nm; subMonth(); render();
  }
  else if (a === 'newOrder') { if (!products().length || !tenants().length) { toast('Isi daftar produk & tenan dulu', true); return; } openOrder(null); }
  else if (a === 'editOrder') openOrder(el.dataset.id);
  else if (a === 'closeSheet') closeSheet();
  else if (a === 'qm') setQty(el.dataset.pid, (S.form.qty[el.dataset.pid] || 0) - 1);
  else if (a === 'qp') setQty(el.dataset.pid, (S.form.qty[el.dataset.pid] || 0) + 1);
  else if (a === 'saveOrder') saveOrder();
  else if (a === 'delOrder') {
    const id = S.form.id;
    if (await confirmDlg('Hapus order ini? Data yang dihapus tidak bisa dikembalikan.')) {
      try { await db.collection('orders').doc(id).delete(); closeSheet(); toast('Order dihapus'); } catch (err) { toast('Gagal menghapus: ' + (err.message || err.code), true); }
    }
  }
  else if (a === 'newPay') openPay(el.dataset.seg, el.dataset.tenant, el.dataset.amt);
  else if (a === 'paySeg') { readPay(); S.pay.segmen = el.dataset.v; renderPaySheet(); }
  else if (a === 'savePay') savePay();
  else if (a === 'delPay') {
    if (await confirmDlg('Hapus catatan pembayaran ini?')) {
      try { await db.collection('payments').doc(el.dataset.id).delete(); toast('Pembayaran dihapus'); } catch (err) { toast('Gagal menghapus: ' + (err.message || err.code), true); }
    }
  }
  else if (a === 'backup') doBackup();
  else if (a === 'restore') { const inp = $('#restoreFile'); inp.value = ''; inp.click(); }
  else if (a === 'exportOrders') exportOrders();
  else if (a === 'exportPays') exportPays();
  else if (a === 'doConnect') doConnect();
  else if (a === 'copyCode') copyText(CODE_GS, 'Kode Apps Script disalin');
  else if (a === 'copyConn') copyText(connInfoText(), 'Info koneksi disalin');
  else if (a === 'retryConn') connect();
  else if (a === 'submitKode') { conn.kode = $('#k-kode').value.trim(); try { localStorage.setItem('mgja-gas-kode', conn.kode); } catch (_) {} connect(); }
  else if (a === 'copyPage') copyText(SELF_HTML, 'Kode halaman disalin');
  else if (a === 'changeConn') {
    if (S.status === 'ok' && !(await confirmDlg('Putuskan koneksi di perangkat ini? Data di Google Sheet tetap aman.', 'Ya, putuskan'))) return;
    try { localStorage.removeItem(CONN_KEY); } catch (_) {}
    location.href = location.href.split('?')[0].split('#')[0];
  }
  else if (a === 'dueSeg') { S.dueSeg = el.dataset.v; S.dueAll = false; render(); }
  else if (a === 'dueAll') { S.dueAll = !S.dueAll; render(); }
  else if (a === 'toggleLibur') { S.showLibur = !el.parentElement.open; }
  else if (a === 'toggleTD') { S.showTenantDetail = !S.showTenantDetail; render(); }
  else if (a === 'copyRekap') {
    const txt = rekapText();
    try { await navigator.clipboard.writeText(txt); toast('Rekap disalin, tinggal tempel di WhatsApp'); }
    catch (_) {
      $('#sheet').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet"><div class="sh-h"><h3>Salin rekap</h3><button class="x" data-act="closeSheet">×</button></div><div class="sh-b"><div class="small muted" style="margin-bottom:8px">Tekan lama teks di bawah, pilih semua, lalu salin.</div><textarea rows="16" readonly>${esc(txt)}</textarea></div></div></div>`;
    }
  }
  else if (a === 'addProduct') { S.draft.products.push({ id: 'p-' + uid(), name: '', pkg: '', hd: 0, hk: 0, ht: 0 }); S.dirty = true; render(); const ins = document.querySelectorAll('[data-d$=".name"][data-d^="p."]'); ins[ins.length - 1]?.focus(); }
  else if (a === 'delProduct') { const p = S.draft.products[+el.dataset.i]; if (await confirmDlg(`Hapus produk “${p.name || 'tanpa nama'}”? Order lama tidak ikut terhapus.`)) { S.draft.products.splice(+el.dataset.i, 1); S.dirty = true; render(); } }
  else if (a === 'addTenant') { S.draft.tenants.push({ id: 't-' + uid(), name: '' }); S.dirty = true; render(); const ins = document.querySelectorAll('[data-d$=".name"][data-d^="t."]'); ins[ins.length - 1]?.focus(); }
  else if (a === 'delTenant') { const t = S.draft.tenants[+el.dataset.i]; if (await confirmDlg(`Hapus tenan “${t.name || 'tanpa nama'}”? Order lama tidak ikut terhapus.`)) { S.draft.tenants.splice(+el.dataset.i, 1); S.dirty = true; render(); } }
  else if (a === 'saveHarga') saveHarga();
  else if (a === 'resetDraft') { S.dirty = false; S.draft = makeDraft(); render(); }
  else if (a === 'applyPrices') applyPrices();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.qty !== undefined) { setQty(el.dataset.qty, el.value); return; }
  if (el.dataset.co) { S.draft.company[el.dataset.co] = el.type === 'checkbox' ? el.checked : el.value; if (el.dataset.co === 'nextNo') S.draft.nextTouched = true; markDirty(); return; }
  if (el.dataset.tempo) { S.draft.tempo[el.dataset.tempo] = el.value === '' ? 0 : +el.value; markDirty(); return; }
  if (el.dataset.libur !== undefined) { S.draft.liburText = el.value; markDirty(); return; }
  if (el.dataset.d) {
    const [kind, i, field] = el.dataset.d.split('.');
    const list = kind === 'p' ? S.draft.products : S.draft.tenants;
    list[+i][field] = ['hd', 'hk', 'ht'].includes(field) ? (el.value === '' ? 0 : +el.value) : el.value;
    if (kind === 'p') updateMargin(+i);
    markDirty();
  }
});
function markDirty() {
  const was = S.dirty; S.dirty = true;
  if (!was) $('#savebar').innerHTML = SAVEBAR;
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'restoreFile' && el.files && el.files[0]) { doRestore(el.files[0]); return; }
  if (el.dataset.in === 'filterTenant') { S.filterTenant = el.value; render(); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['order', 'rekap', 'bayar', 'invoice', 'bukti', 'harga'].includes(h) && h !== S.tab) { S.tab = h; render(); } });
render();
})();
</script>
</body>
</html>
